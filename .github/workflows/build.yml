name: Build EXE
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install winsdk pywebview pyaudiowpatch numpy pyinstaller
      - run: pyinstaller --onefile --noconsole --name VinylPlayer --add-data "index.html;." --collect-all winsdk --collect-all webview --collect-all pyaudiowpatch --collect-all pythonnet --collect-all clr_loader --hidden-import clr app.py
      - uses: actions/upload-artifact@v4
        with:
          name: VinylPlayer-exe
          path: dist/VinylPlayer.exe
